[project]
name = "yahtzee"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yahtzee*"]
version = "0.1.0"
description = "Single-player Yahtzee TUI"
requires-python = ">=3.10"
dependencies = ["textual>=6.00"]

[project.scripts]
yahtzee = "yahtzee.__main__:run"
